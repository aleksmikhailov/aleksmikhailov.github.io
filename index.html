<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Support and privacy information for Taktello — Metronome & Tempo.">
    <title>Taktello — Metronome &amp; Tempo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #333;
        }

        main {
            width: 100%;
            max-width: 620px;
            padding: 48px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .eyebrow {
            color: #667eea;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            color: #29293a;
            font-size: 34px;
            line-height: 1.2;
            margin-bottom: 14px;
        }

        .intro {
            color: #666675;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 auto 30px;
            max-width: 440px;
        }

        nav {
            display: grid;
            gap: 12px;
        }

        nav a {
            display: block;
            padding: 15px 20px;
            border: 1px solid #e5e5ee;
            border-radius: 8px;
            color: #4d56b8;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
        }

        nav a:hover {
            background: #f7f7ff;
            border-color: #b9bdf0;
            transform: translateY(-1px);
        }

        nav a:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 3px;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1e1e2f 0%, #2d1b3d 100%);
            }

            main {
                background: #1f1f2b;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            }

            h1 {
                color: #f0f0f5;
            }

            .intro {
                color: #b7b7c7;
            }

            .eyebrow {
                color: #a7adff;
            }

            nav a {
                color: #b8bdff;
                border-color: #3d3d52;
            }

            nav a:hover {
                background: #2a2a3a;
                border-color: #666b9d;
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 34px 24px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Taktello</p>
        <h1>Metronome &amp; Tempo</h1>
        <p class="intro">
            Need help or want to learn about how your information is handled?
            Choose a link below.
        </p>
        <nav aria-label="Support and privacy">
            <a href="feedback-form.html">Feedback &amp; Support</a>
            <a href="privacy-policy.html">Privacy Policy</a>
        </nav>
    </main>
</body>
</html>
