<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback & Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .container h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .reset-btn {
            background: #f0f0f0;
            color: #333;
        }

        .reset-btn:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .required {
            color: #f44336;
        }

        .hp-field {
            position: absolute;
            left: -9999px;
            height: 0;
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1e1e2f 0%, #2d1b3d 100%);
            }

            .container {
                background: #1f1f2b;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            }

            .container h1,
            label {
                color: #f0f0f5;
            }

            .container p {
                color: #a8a8b8;
            }

            input[type="text"],
            input[type="email"],
            select,
            textarea {
                background: #2a2a3a;
                color: #f0f0f5;
                border-color: #3d3d52;
            }

            ::placeholder {
                color: #80809a;
            }

            .reset-btn {
                background: #34344a;
                color: #f0f0f5;
            }

            .reset-btn:hover {
                background: #40405a;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }

            .container h1 {
                font-size: 24px;
            }

            button {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Feedback & Support</h1>
        <p>We'd love to hear from you! Please fill out the form below and we'll get back to you soon.</p>

        <div class="success-message" id="successMessage">
            ✓ Thank you! Your message has been sent successfully.
        </div>

        <div class="error-message" id="errorMessage">
            ✗ Oops! Something went wrong. Please try again.
        </div>

        <form id="feedbackForm">
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Your full name"
                    required
                />
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your.email@example.com"
                    required
                />
            </div>

            <div class="form-group">
                <label for="topic">Topic <span class="required">*</span></label>
                <select id="topic" name="topic" required>
                    <option value="">-- Select a topic --</option>
                    <option value="Bug Report">Bug Report</option>
                    <option value="Feature Request">Feature Request</option>
                    <option value="General Feedback">General Feedback</option>
                    <option value="Support">Support</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message <span class="required">*</span></label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Please share your feedback or support request..."
                    required
                ></textarea>
            </div>

            <div class="hp-field" aria-hidden="true">
                <label for="website">Leave this field empty</label>
                <input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off" />
            </div>

            <div class="button-group">
                <button type="submit" class="submit-btn">Send Message</button>
                <button type="reset" class="reset-btn">Clear Form</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('feedbackForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Bots fill the hidden field; silently pretend success
            if (form.elements['_gotcha'].value) {
                successMessage.style.display = 'block';
                form.reset();
                return;
            }

            // Get form data
            const formData = new FormData(form);

            try {
                // Send to Formspree
                const response = await fetch('https://formspree.io/f/xrppwzzj', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Show success message
                    successMessage.style.display = 'block';
                    errorMessage.style.display = 'none';
                    form.reset();

                    // Hide success message after 5 seconds
                    setTimeout(() => {
                        successMessage.style.display = 'none';
                    }, 5000);
                } else {
                    // Show error message
                    errorMessage.style.display = 'block';
                    successMessage.style.display = 'none';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
